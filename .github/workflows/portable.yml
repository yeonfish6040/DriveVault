name: Portable builds
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      unsigned_preview:
        description: 'Development preview only: skip code signing and notarization'
        type: boolean
        default: false

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read
jobs:
  signing-policy:
    name: Validate release signing configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.policy.outputs.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: policy
        env:
          REQUIRED: ${{ github.ref_type == 'tag' || !inputs.unsigned_preview }}
        run: |
          python - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + os.environ['REQUIRED'] + '\n')
          PYTHON
      - name: Check signing credentials without printing secret values
        if: steps.policy.outputs.required == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/signing.py
  build:
    needs: signing-policy
    name: Build ${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-latest, target: i686-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - run: cargo test --workspace --target ${{ matrix.target }} --locked
      - run: cargo build --release --workspace --target ${{ matrix.target }} --locked
      - name: Package Linux or unsigned development preview
        if: runner.os == 'Linux' || needs.signing-policy.outputs.required != 'true'
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Sign and notarize macOS package
        if: runner.os == 'macOS' && needs.signing-policy.outputs.required == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python scripts/package.py --target ${{ matrix.target }} --sign
      - name: Sign Windows executables
        if: runner.os == 'Windows' && needs.signing-policy.outputs.required == 'true'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/package.py --target ${{ matrix.target }} --sign
      - uses: actions/upload-artifact@v4
        with:
          name: VaultDrive-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/portable/*.zip
            target/portable/*.zip.sha256
  linux-i686:
    needs: signing-policy
    name: Build i686-unknown-linux-gnu
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a 32-bit Linux userspace
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/source" -w /source i386/debian:bookworm bash -ec '
            apt-get update
            apt-get install -y curl build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev python3 ca-certificates
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --profile minimal --default-host i686-unknown-linux-gnu --default-toolchain 1.96.0
            . "$HOME/.cargo/env"
            rustup target add i686-unknown-linux-gnu
            cargo test --workspace --locked --target i686-unknown-linux-gnu
            cargo build --workspace --release --locked --target i686-unknown-linux-gnu
            python3 scripts/package.py --target i686-unknown-linux-gnu
          '
      - uses: actions/upload-artifact@v4
        with:
          name: VaultDrive-i686-unknown-linux-gnu
          if-no-files-found: error
          retention-days: 30
          path: |
            target/portable/*.zip
            target/portable/*.zip.sha256

  complete:
    name: Assemble complete package
    timeout-minutes: 15
    needs: [signing-policy, build, linux-i686]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VaultDrive-*
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/build_complete.py --skip-build --require-all --artifact-dir artifacts ${{ needs.signing-policy.outputs.required == 'true' && '--require-signatures' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: VaultDrive-complete
          if-no-files-found: error
          retention-days: 30
          path: |
            target/distribution/VaultDrive-complete.zip
            target/distribution/VaultDrive-complete.zip.sha256
